# pip build of the aphfw_cpp module, the compiled FW-APH hub for mpi-sppy.
#
# In mpi-sppy this directory is mpisppy/aphfw_cpp, and the module is optional:
# mpi-sppy's own install compiles nothing.  To build and install it, with
# Gurobi:
#
#   GUROBI_HOME=/path/to/gurobi/linux64 CXX=mpicxx \
#     pip install ./mpisppy/aphfw_cpp
#
# CXX must be the MPI C++ compiler of the MPI that mpi4py uses.  For CPLEX or
# Xpress, turn Gurobi off and name the solver, e.g.
#
#   CXX=mpicxx pip install ./mpisppy/aphfw_cpp \
#     -C cmake.define.USE_GUROBI=OFF -C cmake.define.USE_CPLEX=ON \
#     -C cmake.define.CPLEX_ROOT=/path/to/CPLEX_Studio2211

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "aphfw-cpp"
version = "0.1.0"
description = "Compiled FW-APH hub for mpi-sppy (optional)"
requires-python = ">=3.9"
# numpy and mpi4py are needed at run time, but mpi-sppy already requires both.
# Listing them here could make pip build a second mpi4py against another MPI.
dependencies = []

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.16"
cmake.build-type = "Release"
# The wheel holds only the extension module; there is no Python package.
wheel.packages = []
