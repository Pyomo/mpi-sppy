# Pyomo tracker --- dynamically imports pyomo main

name: pyo tracker

on:
  schedule:
    # min hr dayofmonth month dayofweek
    - cron: "14 3 * * *"

defaults:
    run:
        shell: bash -l {0}

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        pyomo-version: [6.9.5, main]
    steps:
      - uses: actions/checkout@v3
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: test_env
          python-version: 3.11
      - name: Install dependencies
        run: |
          conda install mpi4py pandas setuptools git
          pip install cplex xpress

      - name: set up pyomo
        run: |
          pip install git+https://github.com/Pyomo/pyomo.git@${{ matrix.pyomo-version }}

      - name: setup the program
        run: |
          # [doc] too: this job runs "make doctest" below.  The tracked
          # pyomo (installed from git above) already satisfies the pyomo
          # requirement, so pip does not replace it.
          pip install -e ".[test,doc]"

      - name: Test EF/PH
        run: |
          python mpisppy/tests/test_ef_ph.py

      - name: Test afew
        run: |
          cd examples
          python afew.py xpress_persistent

      - name: Test docs
        run: |
          cd ./doc/
          make doctest
